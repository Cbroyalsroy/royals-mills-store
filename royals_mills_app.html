<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GGC Mills - डिजिटल बही खाता</title>
  
  <!-- Baloo 2 फ़ॉन्ट -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Firebase Scripts (v8.10.1) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Baloo 2', cursive, sans-serif; }
    body { background-color: #f0f2f5; color: #333; padding-bottom: 70px; }

    /* Sticky Header - स्क्रॉल करने पर स्लाइड गायब नहीं होगी */
    .top-header {
      position: sticky; top: 0; z-index: 1000;
      background: #1a237e; color: #fff; padding: 10px 16px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .top-header h2 { font-size: 18px; font-weight: 700; }
    .net-indicator { font-size: 12px; display: flex; align-items: center; gap: 5px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; }

    /* Sub-Header Tabs */
    .sub-tabs {
      position: sticky; top: 48px; z-index: 999;
      background: #ffffff; display: flex; border-bottom: 2px solid #e0e0e0;
    }
    .sub-tab-btn {
      flex: 1; padding: 10px; text-align: center; font-weight: 700;
      border: none; background: transparent; color: #666; font-size: 14px; cursor: pointer;
    }
    .sub-tab-btn.active { color: #1a237e; border-bottom: 3px solid #1a237e; background: #e8eaf6; }

    /* Container Area */
    .pane { display: none; padding: 10px; }
    .pane.active { display: block; }

    /* Compact Form Controls */
    .card-box {
      background: #fff; border-radius: 10px; padding: 12px;
      margin-bottom: 10px; box-shadow: 0 1px 5px rgba(0,0,0,0.08);
    }
    .form-group { margin-bottom: 10px; }
    .form-group label { font-size: 12px; font-weight: 700; color: #555; display: block; margin-bottom: 4px; }
    .form-control {
      width: 100%; padding: 8px 10px; font-size: 14px;
      border: 1px solid #ccc; border-radius: 6px; font-weight: 600;
    }

    /* Notebook / Copy Style Compact Stock Entry Card */
    .compact-card {
      background: #ffffff; border-left: 5px solid #fb8c00; /* Pending default */
      border-radius: 6px; padding: 8px 12px; margin-bottom: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 4px;
    }
    .compact-card.delivered {
      border-left-color: #1a73e8; /* नीली पट्टी = Delivered */
      background: #f4f8ff;
    }
    .card-top-row { display: flex; justify-content: space-between; align-items: center; }
    .cust-title { font-size: 15px; font-weight: 800; color: #1b5e20; }
    .amount-text { font-size: 16px; font-weight: 800; color: #111; }
    .meta-sub { font-size: 11px; color: #666; }

    /* Blue Note Box */
    .blue-note-box {
      background-color: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb;
      border-radius: 4px; padding: 4px 8px; font-size: 12px; font-weight: 600; margin-top: 4px;
    }

    /* Items Layout */
    .item-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
    .item-row select { flex: 1.5; }
    .item-row input { flex: 1; }
    .item-row .total-disp { flex: 1; font-weight: 700; color: #2e7d32; text-align: right; }

    /* Buttons */
    .btn-main {
      width: 100%; background: #1a237e; color: white; padding: 10px;
      border: none; border-radius: 6px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .btn-action { background: #e8eaf6; color: #1a237e; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 700; }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff;
      display: flex; border-top: 1px solid #ddd; height: 55px; z-index: 1000;
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; color: #666; text-decoration: none; font-size: 11px; font-weight: 700;
    }
    .nav-item.active { color: #1a237e; }

    /* Checklist Modal */
    .modal-overlay {
      position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5);
      display: none; align-items: center; justify-content: center; z-index: 2000;
    }
    .modal-content { background: white; padding: 16px; border-radius: 8px; width: 90%; max-width: 400px; }
    .check-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>

  <!-- Top Sticky Header -->
  <div class="top-header">
    <h2 id="millTitleHead">👑 Cbroy food grinding</h2>
    <div class="net-indicator"><div class="dot" id="netDot"></div><span id="netLabel">ऑनलाइन</span></div>
  </div>

  <!-- Dynamic Views -->
  <div id="mainContainer">
    
    <!-- 1. Stock Entry Pane -->
    <div id="stockPane" class="pane active">
      <div class="sub-tabs">
        <button class="sub-tab-btn active" onclick="switchSubTab('newStock')">📦 नई एंट्री</button>
        <button class="sub-tab-btn" onclick="switchSubTab('stockList')">📋 एंट्री लिस्ट</button>
      </div>

      <!-- New Stock Entry Form -->
      <div id="newStockSubPane" style="padding-top:10px;">
        <div class="card-box">
          <div class="form-group">
            <label>ग्राहक का नाम</label>
            <input type="text" id="custNameInput" class="form-control" placeholder="नाम लिखें या चुनें...">
          </div>

          <!-- Grain Items (Rate Hidden, Auto Total Computed) -->
          <div id="itemsContainer">
            <div class="item-row">
              <select class="form-control grain-select" onchange="calculateTotal()">
                <option value="गेहूं आटा" data-rate="2">गेहूं आटा</option>
                <option value="मक्का आटा" data-rate="2.5">मक्का आटा</option>
                <option value="सरसों पिसाई" data-rate="3">सरसों पिसाई</option>
                <option value="मसाला" data-rate="4">मसाला</option>
              </select>
              <input type="number" class="form-control grain-weight" placeholder="वजन (kg)" oninput="calculateTotal()">
              <span class="total-disp">💰 ₹0</span>
            </div>
          </div>
          
          <button type="button" class="btn-action" style="margin-top:5px;" onclick="addItemRow()">➕ आइटम जोड़ें</button>

          <div style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px;">
            <div class="form-group">
              <label>📝 नोट (Optional)</label>
              <input type="text" id="stockNote" class="form-control" placeholder="कोई विशेष टिप्पणी...">
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
              <span style="font-weight:700;">कुल राशि:</span>
              <span id="grandTotalDisp" style="font-size:18px; font-weight:800; color:#1a237e;">₹0</span>
            </div>
            <button class="btn-main" onclick="saveStockEntry()">सहेजें (Save)</button>
          </div>
        </div>
      </div>

      <!-- Stock Entry List (Notebook Compact View) -->
      <div id="stockListSubPane" style="display:none; padding-top:10px;">
        <div id="stockListContainer">
          <p style="text-align:center; padding:20px; color:#666;">डेटा लोड हो रहा है...</p>
        </div>
      </div>
    </div>

    <!-- 2. Ledger / Records Pane -->
    <div id="recPane" class="pane">
      <div class="card-box">
        <h3 style="font-size:15px; margin-bottom:10px;">📋 पुराना हिसाब दर्ज करें</h3>
        <div class="form-group">
          <label>तारीख (DD/MM/YYYY)</label>
          <input type="text" id="ledgerDate" class="form-control" inputmode="numeric" placeholder="25/08/2026" oninput="formatDateInput(this)">
        </div>
        <div class="form-group">
          <label>कुल जमा / बकाया राशि (💰 ₹)</label>
          <input type="number" id="ledgerAmount" class="form-control" placeholder="राशि दर्ज करें">
        </div>
        <div class="form-group">
          <label>नोट (उदा: 100 जमा)</label>
          <input type="text" id="ledgerNote" class="form-control" placeholder="विवरण लिखें...">
        </div>
        <button class="btn-main" onclick="saveLedgerEntry()">हिसाब सहेजें</button>
      </div>
    </div>

    <!-- 3. Customers Pane -->
    <div id="custPane" class="pane">
      <div class="card-box">
        <input type="text" id="custSearch" class="form-control" placeholder="🔍 ग्राहक खोजें...">
      </div>
      <div id="customerList"></div>
    </div>

  </div>

  <!-- Delivery Checklist Modal -->
  <div class="modal-overlay" id="deliveryModal">
    <div class="modal-content">
      <h3 style="font-size:16px; margin-bottom:10px;">🚚 आइटम डिलीवरी स्थिति</h3>
      <div id="modalItemsList"></div>
      <button class="btn-main" style="margin-top:15px;" onclick="closeDeliveryModal()">बंद करें</button>
    </div>
  </div>

  <!-- Bottom Navigation Menu -->
  <div class="bottom-nav">
    <a href="#" class="nav-item active" onclick="switchMainPane('stockPane', this)">📦 स्टॉक</a>
    <a href="#" class="nav-item" onclick="switchMainPane('recPane', this)">📋 हिसाब</a>
    <a href="#" class="nav-item" onclick="switchMainPane('custPane', this)">👥 ग्राहक</a>
  </div>

  <script>
    // 1. फ़ायरबेस कॉन्फ़िगरेशन (अपनी असली चाबियाँ यहाँ भरें)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let stocksData = [];

    // 2. आपकी फ़ायरबेस संरचना के अनुसार सभी संभावित UID फ़ॉर्मेट बनाना
    function getPossibleUIDs() {
      const storedMobile = localStorage.getItem('rms_cu') || '7070203050';
      const cleanMobile = storedMobile.replace(/\D/g, '').slice(-10);

      return [
        '32XFeLpF73XZ2SWzRncIYqC3OVk1', // फ़ायरबेस ऑटो-जनरेटेड UID
        'u_' + cleanMobile,             // u_7070203050
        'user_' + cleanMobile,          // user_7070203050
        cleanMobile,                    // 7070203050
        '+91' + cleanMobile             // +917070203050
      ];
    }

    // 3. फ़ायरबेस से पुराना डेटा खींचने का मल्टी-UID लॉजिक
    function loadData() {
      const uids = getPossibleUIDs();

      // 'in' ऑपरेटर का उपयोग करके सभी संभावित UID का डेटा एक साथ खींचना
      db.collection('stocks')
        .where('uid', 'in', uids)
        .onSnapshot((snapshot) => {
          stocksData = [];
          snapshot.forEach((doc) => {
            stocksData.push({ id: doc.id, ...doc.data() });
          });
          
          // समय के आधार पर सॉर्ट करें
          stocksData.sort((a, b) => (b.createdAt || b.joinedTs || 0) - (a.createdAt || a.joinedTs || 0));
          renderStockList();
        }, (error) => {
          console.error("स्टॉक डेटा लोड करने में समस्या:", error);
          // यदि 'in' क्वेरी इंडेक्स का कारण बनती है तो फॉलबैक फेचिंग
          fallbackFetchStocks();
        });
    }

    // फ़ॉल-बैक फेचिंग
    function fallbackFetchStocks() {
      db.collection('stocks').get().then((snapshot) => {
        stocksData = [];
        snapshot.forEach((doc) => {
          stocksData.push({ id: doc.id, ...doc.data() });
        });
        renderStockList();
      });
    }

    // 4. ऑटो-फॉर्मेट तारीख इनपुट (DD/MM/YYYY)
    function formatDateInput(e) {
      let v = e.value.replace(/\D/g,'');
      if(v.length > 8) v = v.substring(0,8);
      if(v.length >= 5) {
        e.value = v.substring(0,2) + '/' + v.substring(2,4) + '/' + v.substring(4);
      } else if(v.length >= 3) {
        e.value = v.substring(0,2) + '/' + v.substring(2);
      } else {
        e.value = v;
      }
    }

    function getTodayStr() {
      const d = new Date();
      return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
    }

    // Navigation Switcher
    function switchMainPane(paneId, el) {
      document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(paneId).classList.add('active');
      el.classList.add('active');
    }

    function switchSubTab(type) {
      document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
      if(type === 'newStock') {
        document.querySelectorAll('.sub-tab-btn')[0].classList.add('active');
        document.getElementById('newStockSubPane').style.display = 'block';
        document.getElementById('stockListSubPane').style.display = 'none';
      } else {
        document.querySelectorAll('.sub-tab-btn')[1].classList.add('active');
        document.getElementById('newStockSubPane').style.display = 'none';
        document.getElementById('stockListSubPane').style.display = 'block';
        renderStockList();
      }
    }

    // Calculate Total
    function calculateTotal() {
      let grandTotal = 0;
      document.querySelectorAll('.item-row').forEach(row => {
        const select = row.querySelector('.grain-select');
        const weight = parseFloat(row.querySelector('.grain-weight').value) || 0;
        const rate = parseFloat(select.options[select.selectedIndex].getAttribute('data-rate')) || 0;
        const total = weight * rate;
        row.querySelector('.total-disp').innerText = '💰 ₹' + total;
        grandTotal += total;
      });
      document.getElementById('grandTotalDisp').innerText = '₹' + grandTotal;
    }

    function addItemRow() {
      const container = document.getElementById('itemsContainer');
      const div = document.createElement('div');
      div.className = 'item-row';
      div.innerHTML = `
        <select class="form-control grain-select" onchange="calculateTotal()">
          <option value="गेहूं आटा" data-rate="2">गेहूं आटा</option>
          <option value="मक्का आटा" data-rate="2.5">मक्का आटा</option>
          <option value="सरसों पिसाई" data-rate="3">सरसों पिसाई</option>
        </select>
        <input type="number" class="form-control grain-weight" placeholder="वजन (kg)" oninput="calculateTotal()">
        <span class="total-disp">💰 ₹0</span>
      `;
      container.appendChild(div);
    }

    // Save Stock Entry
    function saveStockEntry() {
      const name = document.getElementById('custNameInput').value;
      const note = document.getElementById('stockNote').value;
      const autoDate = getTodayStr();

      if(!name) { alert("कृपया ग्राहक का नाम दर्ज करें"); return; }

      const newDoc = {
        uid: "32XFeLpF73XZ2SWzRncIYqC3OVk1", // आपकी मुख्य फ़ायरबेस UID
        name: name,
        date: autoDate,
        note: note,
        total: parseFloat(document.getElementById('grandTotalDisp').innerText.replace('₹','')),
        status: 'Pending',
        createdAt: Date.now()
      };

      db.collection('stocks').add(newDoc).then(() => {
        alert("एंट्री फ़ायरबेस में सहेजी गई!");
        switchSubTab('stockList');
      }).catch(err => {
        console.error("सहेजने में त्रुटि:", err);
      });
    }

    // Render Compact Notebook View
    function renderStockList() {
      const container = document.getElementById('stockListContainer');
      container.innerHTML = '';

      if(stocksData.length === 0) {
        container.innerHTML = `<p style="text-align:center; padding:20px; color:#777;">कोई डेटा नहीं मिला</p>`;
        return;
      }

      stocksData.forEach(item => {
        const isDelivered = (item.status === 'Delivered');
        const cardClass = isDelivered ? 'compact-card delivered' : 'compact-card';
        let noteHtml = item.note ? `<div class="blue-note-box">📝 ${item.note}</div>` : '';

        container.innerHTML += `
          <div class="${cardClass}">
            <div class="card-top-row">
              <span class="cust-title">${item.name || 'अज्ञात ग्राहक'}</span>
              <span class="amount-text">₹${item.total || 0}</span>
            </div>
            <div class="card-top-row">
              <span class="meta-sub">📅 ${item.date || ''}</span>
              <button class="btn-action" onclick="openDeliveryChecklist('${item.id}')">🚚 डिलीवरी</button>
            </div>
            ${noteHtml}
          </div>
        `;
      });
    }

    // Modal Operations
    let currentEditId = null;
    function openDeliveryChecklist(id) {
      currentEditId = id;
      const item = stocksData.find(s => s.id === id);
      const modalList = document.getElementById('modalItemsList');
      modalList.innerHTML = `
        <div class="check-item">
          <span>${item.grain || 'अनाज'} (${item.weight || 0}kg)</span>
          <button class="btn-action" onclick="toggleStatus('${item.id}', '${item.status}')">
            ${item.status === 'Delivered' ? '✔️ Delivered' : '❌ Pending'}
          </button>
        </div>
      `;
      document.getElementById('deliveryModal').style.display = 'flex';
    }

    function toggleStatus(id, currentStatus) {
      const nextStatus = (currentStatus === 'Delivered') ? 'Pending' : 'Delivered';
      db.collection('stocks').doc(id).update({ status: nextStatus }).then(() => {
        closeDeliveryModal();
      });
    }

    function closeDeliveryModal() {
      document.getElementById('deliveryModal').style.display = 'none';
    }

    // पेज लोड होने पर स्वचालित डेटा फेचिंग चालू करें
    window.addEventListener('DOMContentLoaded', () => {
      loadData();
    });
  </script>
</body>
</html>
